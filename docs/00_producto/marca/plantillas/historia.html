<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="pieza" content="1080x1920">
<title>Historia</title>
<!--
  Historia de Instagram y Facebook, y estado de WhatsApp: 1080 x 1920 (9:16).

  Zonas que no se usan: los 270 px de arriba (ahí van la foto de perfil, el
  nombre y la barra de avance) y los 340 px de abajo (ahí van "Enviar mensaje"
  y las reacciones). Lo importante vive en el centro.

  TEXTO DE EJEMPLO: el de la portada de Facebook, ya publicado y aprobado.
  Cada pieza nueva cambia el texto, con el visto bueno del propietario (D-305).
-->
<link rel="stylesheet" href="marca.css">
<style>
  html, body { width: 1080px; height: 1920px; }

  body {
    background:
      radial-gradient(circle 700px at 900px 420px, rgba(219, 39, 119, .26), transparent),
      radial-gradient(circle 600px at 200px 1500px, rgba(196, 181, 253, .20), transparent),
      linear-gradient(160deg, var(--morado-noche) 0%, var(--morado-medio) 50%, var(--morado) 100%);
    padding: 270px 90px 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
  }

  .firma {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    font-size: 42px;
    font-weight: 900;
  }

  .firma .logo { --lado: 130px; }

  .centro { display: flex; flex-direction: column; align-items: center; }

  .centro .etiqueta { font-size: 30px; }

  h1 {
    margin-top: 40px;
    font-size: 104px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -1px;
  }

  .pilares {
    margin-top: 56px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .pilar {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 20px 34px;
    border-radius: 20px;
    background: rgba(255, 255, 255, .10);
    border: 1px solid rgba(255, 255, 255, .22);
    font-size: 36px;
    font-weight: 600;
    color: var(--texto-claro);
  }

  .pilar::before {
    content: "✓";
    color: var(--verde);
    font-weight: 700;
  }

  .web {
    padding: 26px 56px;
    border-radius: 999px;
    background: var(--blanco);
    color: var(--morado-medio);
    font-size: 44px;
    font-weight: 800;
    box-shadow: 0 14px 40px rgba(20, 0, 50, .35);
  }
</style>
</head>
<body>

  <div class="firma"><div class="logo"><img src="../marca.svg" alt=""></div>Salón y Más</div>

  <section class="centro">
    <span class="etiqueta"><span class="bandera" aria-hidden="true"></span>Software para Colombia</span>
    <h1>Menos cuaderno,<br><span class="acento">más control<br>de tu salón</span></h1>
    <div class="pilares">
      <span class="pilar">Agenda sin cruces</span>
      <span class="pilar">Control de caja diario</span>
      <span class="pilar">Comisiones exactas</span>
    </div>
  </section>

  <span class="web">salonymas.com</span>

</body>
</html>
