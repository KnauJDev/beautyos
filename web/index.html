<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Agenda, clientes, cobros e inventario para salones de belleza, barberías, spas de uñas y peluquerías caninas.">
  <meta name="theme-color" content="#7C3AED">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Salón y Más">
  <!-- iOS recorta el icono el mismo; se usa la version a sangre para que no queden esquinas negras. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Salón y Más</title>
  <link rel="manifest" href="manifest.json">

  <!--
    NO BORRAR. La app no arranca sin este archivo: sale pantalla en blanco.

    `supabase_flutter` depende de `passkeys`, y su plugin web (`passkeys_web`)
    llama a `PasskeyAuthenticator.init()` al registrarse, antes de `runApp`.
    Si el global no existe, el registro lanza una excepcion, `main()` muere y
    no se pinta nada. No importa que nuestro codigo nunca use passkeys.

    El archivo se compilo desde el codigo fuente del propio paquete
    (`passkeys_web-2.9.0/javascript`, `npm run build`) y se guarda aqui a
    proposito, en vez de descargarlo de una release de GitHub en cada visita
    como se hacia antes (D-089): asi no dependemos de un tercero en tiempo de
    ejecucion. Al subir de version `supabase_flutter`, hay que regenerarlo.
  -->
  <script src="passkeys_bundle.js"></script>
  <!-- SDK Oficial de Checkout de ePayco (D-141) -->
  <script type="text/javascript" src="https://checkout.epayco.co/checkout.js"></script>
  <script>
    window.openEpaycoCheckout = function(data) {
      if (typeof ePayco === 'undefined') {
        alert('No se pudo cargar la pasarela de ePayco. Por favor verifica tu conexión o desactiva bloqueadores de anuncios.');
        return;
      }
      try {
        var handler = ePayco.checkout.configure({
          key: data.publicKey,
          test: data.testMode === true
        });
        handler.open({
          name: data.name,
          description: data.description,
          invoice: data.invoice,
          currency: 'cop',
          amount: data.amount,
          tax_base: '0',
          tax: '0',
          country: 'co',
          lang: 'es',
          extra1: data.extra1,
          extra2: data.extra2,
          extra3: data.extra3,
          confirmation: data.confirmation,
          response: data.response,
          name_billing: data.nameBilling || '',
          email_billing: data.emailBilling || '',
          mobilephone_billing: data.phoneBilling || '',
          external: false,
          autoclick: false
        });
      } catch (err) {
        console.error('Error al abrir ePayco checkout:', err);
        alert('Error al abrir la pasarela de ePayco: ' + err);
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
